<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Martin</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#8e8e93;--or:#ff9f0a;--ln:#2c2c2e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.3 system-ui,-apple-system,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
h1{margin:0;font-size:28px}
.hb{background:var(--card);color:var(--or);border:0;border-radius:18px;padding:8px 14px;font-size:14px}
main{flex:1;overflow-y:auto;padding:8px 14px 90px}
nav{display:flex;background:#111;border-top:1px solid var(--ln)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:12px 2px;font-size:12px}
nav button.on{color:var(--or)}
.card{background:var(--card);border-radius:20px;padding:6px 14px;margin-bottom:14px}
.r{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.r:last-child{border:0}
.cb{width:26px;height:26px;border:2px solid #777;border-radius:8px;flex:none}
.cb.on{background:var(--or);border-color:var(--or);position:relative}
.cb.on::after{content:"✓";position:absolute;inset:0;text-align:center;color:#000;font-weight:700;line-height:22px}
.rm{flex:1;min-width:0}
.tt{font-size:17px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mu);margin-top:2px}
.pl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;color:var(--c);border:1px solid var(--c)}
.dt{color:var(--or);font-size:15px;white-space:nowrap;align-self:flex-start;padding-top:4px;text-align:right}
.dt.od{color:#ff453a}
.dn .tt{text-decoration:line-through;color:var(--mu)}
.ban{border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;background:#2a2410;border:1px solid #6b5a14}
.ban.hot{background:#2d1412;border-color:#8a2b22}.ban.ok{background:#10261a;border-color:#1f6b3d}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--or);color:#000;border:0;font-size:34px;line-height:1;box-shadow:0 4px 14px #000a}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}
.day{background:var(--card);border-radius:10px;min-height:54px;padding:4px;text-align:center;font-size:14px}
.day.today{outline:1.5px solid var(--or)}.day.sel{background:#3a2a0a}.day.x{opacity:.25}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.mh{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mh button{background:var(--card);color:var(--tx);border:0;border-radius:12px;width:42px;height:38px;font-size:18px}
h3{margin:18px 4px 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.x2{margin-left:auto;background:none;border:0;color:var(--mu);font-size:13px}
input,select,textarea{background:#2c2c2e;color:var(--tx);border:0;border-radius:10px;padding:11px;font-size:16px;width:100%;font-family:inherit}
textarea{display:block;min-height:110px;max-height:40vh;resize:none;line-height:1.35}
input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;accent-color:#ff9f0a}
.ck{display:flex;align-items:center;gap:10px;margin:2px 0 0;font-size:14px;color:var(--tx)}
input[type=color]{width:46px;padding:2px;height:42px;flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--c,#666);color:var(--c,#bbb);font-size:14px}
.chip.on{background:var(--c,#555);color:#000;font-weight:600}
.cu{display:none;gap:8px;margin-top:8px}.cu.show{display:flex}.cu.col{flex-direction:column;gap:10px}
#m{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.show{display:flex}
.sheet{background:#161618;width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;padding:13px;border:0;border-radius:12px;font-size:16px;background:#2c2c2e;color:var(--tx)}
.btns .pr{background:var(--or);color:#000;font-weight:600}.btns .dl{color:#ff453a}
.row2{display:flex;gap:8px;align-items:center}
.cx{margin-left:7px;opacity:.8;padding:0 2px}.pt{font-size:12px;color:#c7c7cc;text-align:right;margin-top:3px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wk input{padding:9px 2px;text-align:center;font-size:15px}.wk .wd{text-align:center;color:var(--mu);font-size:12px;padding:2px 0}
.nw{margin-bottom:24px;border:1px dashed #48484a;background:#141416}.ar{color:var(--mu);width:14px;display:inline-block}
.cs{width:42px;height:42px;border-radius:50%;border:2px solid #666;flex:none;padding:0}
.dot.dm{border-radius:1px;transform:rotate(45deg);width:8px;height:8px;margin:0 1px}
#cp{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#cp.show{display:flex}
#cps{background:#222428;border-radius:16px;width:100%;max-width:420px;padding:16px}
.cprow{display:flex;margin-top:12px;border-radius:10px;overflow:hidden;height:170px}
#cp_sw{width:30%}
#cp_sv{flex:1;position:relative;touch-action:none;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,var(--h,#f00))}
#cp_cur{position:absolute;width:22px;height:22px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 3px #0008}
#cp_hue{position:relative;height:14px;border-radius:7px;margin:24px 10px 6px;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#cp_th{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 3px #0008}
.dt .pt.ind{white-space:normal;max-width:120px;margin-left:auto;overflow-wrap:anywhere}
.dtl{display:block;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:15px}.kv:last-child{border:0}
.kv .k{color:var(--mu);flex:none}.kv .v{text-align:right;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="app">
<header><h1 id="ttl">Martin</h1><button class="hb" id="hb"></button></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<button class="fab" id="fab" onclick="openForm()">+</button>
<div id="m"><div class="sheet" id="sheet"></div></div>
<div id="cp"><div id="cps"><b style="font-size:18px">Вибір кольору</b><div class="cprow"><div id="cp_sw"></div><div id="cp_sv"><div id="cp_cur"></div></div></div><div id="cp_hue"><div id="cp_th"></div></div><div class="row2" style="margin-top:14px"><input id="cp_hex" maxlength="7" style="font-family:monospace" oninput="cpHex(this.value)"></div><div class="btns"><button onclick="cpClose()">Скасувати</button><button class="pr" onclick="cpOk()">Готово</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cbtn=(id,v,on)=>`<button type="button" class="cs" id="${id}" data-v="${v}" style="background:${v}" onclick="cpOpen('${id}')"${on?` onchange="${on}"`:''}></button>`;
const KEY='martin_v1',KINDS={type:'Тип завдання',diff:'Важкість',ind:'Свій індикатор'};
const MON=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const MONF=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const DEF={tasks:[],cap:2,subjects:[{id:'s1',name:'Фізика',color:'#38bdf8'},{id:'s2',name:'Історія України',color:'#fb923c'},{id:'s3',name:'Основи академ. письма',color:'#a78bfa'}],
presets:{ind:[],type:[{l:'Творчий',c:'#a78bfa'},{l:'Математичний',c:'#38bdf8'},{l:'Рутинний',c:'#94a3b8'}],
diff:[{l:'Легкий',c:'#4ade80'},{l:'Середній',c:'#facc15'},{l:'Важкий',c:'#e5383b'},{l:'Реферат',c:'#f472b6'},{l:'Диплом',c:'#a855f7'}],
time:[{l:'5 хв',c:'#4ade80'},{l:'30 хв',c:'#a3e635'},{l:'Година',c:'#facc15'},{l:'На кілька днів',c:'#fb923c'}]}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||JSON.parse(JSON.stringify(DEF));
if(!S.caps)S.caps=Array(7).fill(S.cap||2);
if(!S.presets.ind)S.presets.ind=[];
(function(){const R=(l,o,n)=>[...S.presets.diff,...S.tasks.map(t=>t.diff)].forEach(p=>{if(p&&p.l===l&&p.c===o)p.c=n});R('Диплом','#ef4444','#a855f7');R('Важкий','#fb923c','#e5383b')})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const pd=s=>new Date(s+'T00:00');
const fd=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
let view='list',cur=new Date(),selDay=today(),F=null;
cur.setDate(1);

const indR=t=>t.ind?(t.ind.c?`<div class="pt ind"><span class="pill" style="--c:${t.ind.c}">${esc(t.ind.l)}</span></div>`:`<div class="pt ind">${esc(t.ind.l)}</div>`):'';
function row(t){const sb=S.subjects.find(s=>s.id===t.subj),od=!t.done&&t.date<today();
return `<div class="r ${t.done?'dn':''}"><div class="cb ${t.done?'on':''}" onclick="tog('${t.id}')"></div><div class="rm" onclick="openDetail('${t.id}')"><div class="tt">${esc(t.title)}</div><div class="sub">${sb?`<span style="color:${sb.color}">${esc(sb.name)}</span> · `:''}${t.hours||0} год</div><div class="pl">${['type','diff'].map(k=>t[k]?`<span class="pill" style="--c:${t[k].c}">${esc(t[k].l)}</span>`:'').join('')}</div></div><div class="dt ${od?'od':''}">${fd(t.date)}${t.pts!=null&&t.pts!==''?`<div class="pt">${t.pts} б.</div>`:''}${indR(t)}</div></div>`}
const open=()=>S.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date));
const heavy=t=>t.diff&&/важк|реферат|диплом/i.test(t.diff.l);

function capUntil(ds){let s=0,d=pd(today()),e=pd(ds);for(;d<=e;d.setDate(d.getDate()+1))s+=+S.caps[(d.getDay()+6)%7]||0;return s}
function banner(){
const o=open();if(!o.length)return '';
const td=today(),late=o.filter(t=>t.date<td).length;let best=null,cum=0;
o.forEach((t,i)=>{cum+=+t.hours||0;const days=Math.max(1,Math.round((pd(t.date)-pd(td))/864e5)+1);const capH=capUntil(t.date);const ratio=cum/Math.max(capH,.1);
if(t.date>=td&&(!best||ratio>best.ratio))best={t,ratio,cum,days,capH,hv:o.slice(0,i+1).filter(heavy).length}});
let h='';
if(late)h+=`<div class="ban hot">⏰ Прострочених завдань: ${late}. Почни з найстаріших — по одному кроку.</div>`;
if(best&&best.ratio>=.5){const p=Math.round(best.ratio*100),hot=best.ratio>=.8;
h+=`<div class="ban ${hot?'hot':''}">${hot?'🔥':'⚠️'} До «${esc(best.t.title)}» ${best.days} дн., але разом із попередніми завданнями назбиралось ${best.cum} год${best.hv?` (важких: ${best.hv})`:''}. Це ~${p}% твого вільного часу до дедлайну (${best.capH} год). ${hot?'Краще почати вже сьогодні!':'Не відкладай — зроби хоча б перший крок.'}</div>`}
else if(!late)h+=`<div class="ban ok">✅ Навантаження в нормі. Хороший момент, щоб зробити щось наперед!</div>`;
return h}

function render(){
$('#ttl').textContent={list:'Martin',cal:'Календар',subj:'Предмети',set:'Налаштування',arch:'Архів'}[view];
const hb=$('#hb');hb.style.display=view==='list'||view==='arch'?'':'none';hb.textContent=view==='arch'?'← Список':'Архів';hb.onclick=()=>go(view==='arch'?'list':'arch');
$('#fab').style.display=view==='list'||view==='cal'?'':'none';
$('#nav').innerHTML=[['list','📋','Список'],['cal','📅','Календар'],['subj','📚','Предмети'],['set','⚙️','Налаштування']].map(([v,i,n])=>`<button class="${view===v||(v==='list'&&view==='arch')?'on':''}" onclick="go('${v}')">${i}<br>${n}</button>`).join('');
const m=$('#main');let h='';
if(view==='list'){const o=open();h=banner()+(o.length?`<div class="card">${o.map(row).join('')}</div>`:'<div class="empty">Завдань немає 🎉<br>Натисни «+», щоб додати</div>')}
else if(view==='arch'){const d=S.tasks.filter(t=>t.done).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));h=d.length?`<div class="card">${d.map(row).join('')}</div>`:'<div class="empty">Архів порожній</div>'}
else if(view==='cal')h=calView();
else if(view==='subj')h=subjView();
else h=setView();
m.innerHTML=h;
if(view==='arch')m.scrollTop=m.scrollHeight;else if(!window._keep)m.scrollTop=0}

function calView(){
const y=cur.getFullYear(),mo=cur.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
let c=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(d=>`<div class="wd">${d}</div>`).join('');
for(let i=0;i<first;i++)c+='<div></div>';
for(let d=1;d<=dim;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ts=S.tasks.filter(t=>t.date===k&&!t.done);
c+=`<div class="day ${k===today()?'today':''} ${k===selDay?'sel':''}" onclick="selDay='${k}';render()">${d}<div class="dots">${ts.slice(0,6).map(t=>`<span class="dot${t.diff&&/диплом/i.test(t.diff.l)?' dm':''}" style="--c:${t.diff?t.diff.c:'#8e8e93'}"></span>`).join('')}</div></div>`}
const sel=S.tasks.filter(t=>t.date===selDay).sort((a,b)=>a.done-b.done);
return `<div class="mh"><button onclick="mv(-1)">‹</button><b>${MONF[mo]} ${y}</b><button onclick="mv(1)">›</button></div><div class="cal">${c}</div><h3>${fd(selDay)}</h3>${sel.length?`<div class="card">${sel.map(row).join('')}</div>`:'<div class="empty" style="padding:14px">На цей день завдань немає</div>'}`}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}

function subjView(){
let h=`<div class="card nw"><div style="font-weight:600;margin:12px 0 8px">Новий предмет</div><div class="row2" style="padding-bottom:14px"><input id="ns" placeholder="Назва предмета">${cbtn('nc','#34d399')}<button class="hb" onclick="addSubj()">Додати</button></div></div>`;
S.subjects.forEach(s=>{const ts=open().filter(t=>t.subj===s.id),c=S.coll&&S.coll[s.id];
h+=`<h3 onclick="togColl('${s.id}')" style="cursor:pointer"><span class="ar">${c?'▸':'▾'}</span><span class="sw" style="background:${s.color}"></span>${esc(s.name)} <span style="color:var(--mu);font-weight:400">${ts.length}</span><button class="x2" onclick="event.stopPropagation();editSubj('${s.id}')">змінити</button></h3>${!c&&ts.length?`<div class="card">${ts.map(row).join('')}</div>`:''}`});
const no=open().filter(t=>!S.subjects.some(s=>s.id===t.subj));
if(no.length){const c=S.coll&&S.coll._no;h+=`<h3 onclick="togColl('_no')" style="cursor:pointer"><span class="ar">${c?'▸':'▾'}</span>Без предмета <span style="color:var(--mu);font-weight:400">${no.length}</span></h3>${c?'':`<div class="card">${no.map(row).join('')}</div>`}`}
return h}
function setView(){return `<h3>Вільні години на навчання</h3><div class="wk">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map((n,i)=>`<div><div class="wd">${n}</div><input type="number" min="0" max="24" step="0.5" value="${S.caps[i]}" onchange="S.caps[${i}]=Math.max(0,+this.value||0);save()"></div>`).join('')}</div><div class="sub" style="margin-top:6px">Скільки годин у цей день тижня ти реально можеш витратити на завдання. Потрібно для підказок про навантаження.</div><h3>Резервна копія</h3><div class="row2"><button class="hb" onclick="exportData()">⬇ Зберегти копію</button><button class="hb" onclick="$('#imp').click()">⬆ Відновити з копії</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)"></div><div class="sub" style="margin-top:6px">Файл збережеться в «Завантаження». Роби копію раз на кілька днів.</div>`}
function togColl(id){S.coll=S.coll||{};S.coll[id]=!S.coll[id];save();window._keep=1;render();window._keep=0}
function editSubj(id){const s=S.subjects.find(x=>x.id===id);F={sid:id};
$('#sheet').innerHTML=`<b style="font-size:20px">Змінити предмет</b><label>Назва</label><div class="row2"><input id="es_n" value="${esc(s.name)}">${cbtn('es_c',s.color)}</div><div class="btns"><button class="dl" onclick="if(delSubj('${id}'))closeF()">Видалити</button><button onclick="closeF()">Скасувати</button><button class="pr" onclick="saveSubj()">Зберегти</button></div>`;$('#m').classList.add('show')}
function saveSubj(){const n=$('#es_n').value.trim();if(!n){alert('Вкажи назву');return}const s=S.subjects.find(x=>x.id===F.sid);s.name=n;s.color=$('#es_c').dataset.v;save();closeF();render()}

function addSubj(){const n=$('#ns').value.trim();if(!n)return;S.subjects.push({id:'s'+Date.now(),name:n,color:$('#nc').dataset.v});save();window._keep=0;render()}
function delSubj(id){if(!confirm('Видалити предмет? Завдання залишаться без предмета.'))return false;S.subjects=S.subjects.filter(s=>s.id!==id);save();render();return true}
function exportData(){const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='martin-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.subjects)||!d.presets)throw 0;if(!confirm('Замінити поточні дані копією? ('+d.tasks.length+' завдань)')){inp.value='';return}S=d;if(!S.caps)S.caps=Array(7).fill(S.cap||2);if(!S.presets.ind)S.presets.ind=[];save();render()}catch(e){alert('Не вдалося прочитати файл копії')}inp.value=''};r.readAsText(f)}
function go(v){view=v;window._keep=0;render()}
function tog(id){const t=S.tasks.find(t=>t.id===id);t.done=!t.done;t.doneAt=t.done?Date.now():null;save();window._keep=1;render();window._keep=0}

/* form */
const same=(a,b)=>a&&b&&a.l===b.l&&a.c===b.c;
function cuBox(k){
const v=F.cu[k]&&F.sel[k],nc=k==='ind'&&v&&F.sel[k].c==null;
const ib=`<input id="ct_${k}" placeholder="${k==='ind'?'Назва індикатора':'Своя назва'}" value="${v?esc(F.sel[k].l):''}" oninput="cuIn('${k}')">${cbtn('cc_'+k,v&&F.sel[k].c?F.sel[k].c:'#ff4d8d',"cuIn('"+k+"')")}`;
if(k!=='ind')return `<div class="cu ${v?'show':''}" id="cu_${k}">${ib}</div>`;
return `<div class="cu col ${v?'show':''}" id="cu_ind"><div class="row2">${ib}</div><label class="ck"><input type="checkbox" id="ck_ind" ${nc?'':'checked'} onchange="cuIn('ind')">З кольором</label></div>`}
function openForm(id){
const t=id&&S.tasks.find(t=>t.id===id);
F={id:id||null,sel:{},cu:{},orig:{}};
Object.keys(KINDS).forEach(k=>{F.sel[k]=t&&t[k]?{...t[k]}:null;F.orig[k]=F.sel[k]?{...F.sel[k]}:null;F.cu[k]=!!(F.sel[k]&&!S.presets[k].some(p=>same(p,F.sel[k])))});
const dflt=view==='cal'?selDay:today();
$('#sheet').innerHTML=`<b style="font-size:20px">${t?'Редагувати':'Нове завдання'}</b>
<label>Назва</label><input id="f_t" value="${t?esc(t.title):''}" placeholder="Напр. Контрольна з фізики">
<label>Предмет</label><select id="f_s" onchange="subjSel()"><option value="">— без предмета —</option>${S.subjects.map(s=>`<option value="${s.id}" ${t&&t.subj===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}<option value="__new">＋ Новий предмет…</option></select><div class="cu" id="cu_s"><input id="ns2" placeholder="Назва нового предмета">${cbtn('nc2','#34d399')}</div>
<label>Дедлайн</label><input type="date" id="f_d" value="${t?t.date:dflt}">
<label>Скільки годин потрібно (сумарно)</label><input type="number" id="f_h" min="0" step="0.5" value="${t?t.hours:''}" placeholder="Напр. 3">
<label>Бали за завдання (необов'язково)</label><input type="number" id="f_p" min="0" step="0.5" value="${t&&t.pts!=null?t.pts:''}" placeholder="Напр. 10">
${Object.entries(KINDS).map(([k,n])=>`<label>${n}</label><div class="chips" id="ch_${k}"></div>${cuBox(k)}`).join('')}
${t?'':`<label>Опис (необов'язково)</label><textarea id="f_ds" rows="3" placeholder="Що саме треба зробити, посилання, нотатки…"></textarea>`}
<div class="btns">${t?'<button class="dl" onclick="del()">Видалити</button>':''}<button onclick="cancelF()">Скасувати</button><button class="pr" onclick="saveF()">Зберегти</button></div>`;
Object.keys(KINDS).forEach(k=>chips(k));indUI();
$('#sheet').scrollTop=0;$('#m').classList.add('show')}
function chips(k){$('#ch_'+k).innerHTML=S.presets[k].map((p,i)=>`<span class="chip ${!F.cu[k]&&same(F.sel[k],p)?'on':''}" style="--c:${p.c||'#e5e5ea'}" onclick="pick('${k}',${i})">${esc(p.l)}${k!=='type'&&DEF.presets[k].some(d=>same(d,p))?'':`<b class="cx" onclick="event.stopPropagation();delPreset('${k}',${i})">×</b>`}</span>`).join('')+`<span class="chip ${F.cu[k]?'on':''}" onclick="cust('${k}')">＋ Своє</span>`}
function delPreset(k,i){const p=S.presets[k][i];if(!confirm('Видалити індикатор «'+p.l+'»? У вже створених завданнях він залишиться.'))return;S.presets[k].splice(i,1);if(same(F.sel[k],p)){F.sel[k]=null;F.cu[k]=false;$('#cu_'+k).classList.remove('show')}save();chips(k)}
function pick(k,i){const p=S.presets[k][i];F.sel[k]=!F.cu[k]&&same(F.sel[k],p)?null:{...p};F.cu[k]=false;$('#cu_'+k).classList.remove('show');chips(k)}
function cust(k){F.cu[k]=!F.cu[k];$('#cu_'+k).classList.toggle('show',F.cu[k]);if(F.cu[k])cuIn(k);else F.sel[k]=null;chips(k)}
function cuIn(k){const l=$('#ct_'+k).value.trim();let c=$('#cc_'+k).dataset.v;if(k==='ind'){indUI();if(!$('#ck_ind').checked)c=null}F.sel[k]=l?{l,c}:null}
function indUI(){const b=$('#ck_ind');if(b)$('#cc_ind').style.display=b.checked?'':'none'}
function closeF(){$('#m').classList.remove('show')}
function cancelF(){if(F&&F.id)openDetail(F.id);else closeF()}
function subjSel(){$('#cu_s').classList.toggle('show',$('#f_s').value==='__new')}
function saveF(){
const title=$('#f_t').value.trim(),date=$('#f_d').value;
if(!title||!date){alert('Вкажи назву і дедлайн');return}
Object.keys(KINDS).forEach(k=>{if(F.cu[k]&&F.sel[k]&&!same(F.sel[k],F.orig[k])&&!S.presets[k].some(p=>p.l===F.sel[k].l))S.presets[k].push({...F.sel[k]})});
let sid=$('#f_s').value;if(sid==='__new'){const n=$('#ns2').value.trim();if(!n){alert('Вкажи назву нового предмета');return}const ex=S.subjects.find(s=>s.name.toLowerCase()===n.toLowerCase());if(ex)sid=ex.id;else{sid='s'+Date.now();S.subjects.push({id:sid,name:n,color:$('#nc2').dataset.v})}}
const d={title,date,subj:sid,hours:parseFloat($('#f_h').value)||0,type:F.sel.type,diff:F.sel.diff,ind:F.sel.ind,pts:$('#f_p').value===''?null:parseFloat($('#f_p').value)};
if(F.id)Object.assign(S.tasks.find(t=>t.id===F.id),d);else S.tasks.push({id:'t'+Date.now(),done:false,desc:$('#f_ds').value.trim(),...d});
save();if(F.id){const id=F.id;window._keep=1;render();window._keep=0;openDetail(id)}else{closeF();render()}}
function del(){if(!confirm('Видалити завдання?'))return;S.tasks=S.tasks.filter(t=>t.id!==F.id);save();closeF();window._keep=1;render();window._keep=0}
/* details */
function fdl(s){const d=pd(s),y=d.getFullYear()!==new Date().getFullYear();return ['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'][d.getDay()]+', '+d.getDate()+' '+['січня','лютого','березня','квітня','травня','червня','липня','серпня','вересня','жовтня','листопада','грудня'][d.getMonth()]+(y?' '+d.getFullYear():'')}
const indH=p=>p.c?`<span class="pill" style="--c:${p.c}">${esc(p.l)}</span>`:esc(p.l);
function openDetail(id){
const t=S.tasks.find(x=>x.id===id);if(!t)return;
const kv=(a,b)=>`<div class="kv"><span class="k">${a}</span><span class="v">${b}</span></div>`;
const sb=S.subjects.find(s=>s.id===t.subj),od=!t.done&&t.date<today();
const ks=Object.entries(KINDS).filter(([k])=>t[k]).map(([k,n])=>kv(n,indH(t[k]))).join('');
$('#sheet').innerHTML=`<b class="dtl">${esc(t.title)}</b>
<div class="card" style="margin:14px 0 4px">${sb?kv('Предмет',`<span style="color:${sb.color}">${esc(sb.name)}</span>`):''}${kv('Дедлайн',`<span style="color:${od?'#ff453a':'var(--or)'}">${fdl(t.date)}</span>`)}${kv('Години',(t.hours||0)+' год')}${t.pts!=null&&t.pts!==''?kv('Бали',t.pts):''}${ks}${t.done?kv('Статус','Виконано ✓'):''}</div>
<label>Опис</label><textarea id="d_ds" placeholder="Додай опис завдання…" oninput="descIn('${id}',this)">${esc(t.desc||'')}</textarea>
<div class="btns"><button onclick="closeF()">Закрити</button><button class="pr" onclick="openForm('${id}')">Редагувати</button></div>`;
$('#sheet').scrollTop=0;$('#m').classList.add('show');autoH($('#d_ds'))}
function descIn(id,el){const t=S.tasks.find(x=>x.id===id);if(t){t.desc=el.value;save()}autoH(el)}
function autoH(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight+2,innerHeight*.4)+'px'}
$('#m').addEventListener('click',e=>{if(e.target.id==='m')closeF()});

const CP={id:null,h:0,s:1,v:1,hex:'#ff0000'};
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return '#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function hex2hsv(x){const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);let h=0;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60}return{h,s:mx?d/mx:0,v:mx}}
function cpOpen(id){Object.assign(CP,{id},hex2hsv($('#'+id).dataset.v||'#ff0000'));$('#cp').classList.add('show');cpUp()}
function cpUp(){const hex=hsv2hex(CP.h,CP.s,CP.v),hh=hsv2hex(CP.h,1,1);$('#cp_sv').style.setProperty('--h',hh);$('#cp_cur').style.left=CP.s*100+'%';$('#cp_cur').style.top=(1-CP.v)*100+'%';$('#cp_th').style.left=CP.h/360*100+'%';$('#cp_th').style.background=hh;$('#cp_sw').style.background=hex;if(document.activeElement!==$('#cp_hex'))$('#cp_hex').value=hex;CP.hex=hex}
function cpHex(x){if(/^#[0-9a-f]{6}$/i.test(x)){Object.assign(CP,hex2hsv(x));cpUp()}}
function cpClose(){$('#cp').classList.remove('show')}
function cpOk(){const el=$('#'+CP.id);el.dataset.v=CP.hex;el.style.background=CP.hex;el.dispatchEvent(new Event('change'));cpClose()}
function drag(el,fn){const mv=e=>{const r=el.getBoundingClientRect();fn(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)))};el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);mv(e);el.onpointermove=mv});el.addEventListener('pointerup',()=>{el.onpointermove=null})}
drag($('#cp_sv'),(x,y)=>{CP.s=x;CP.v=1-y;cpUp()});drag($('#cp_hue'),x=>{CP.h=Math.min(359.99,x*360);cpUp()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
