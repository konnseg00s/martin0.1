<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Martin</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:#8e8e93;--or:#ff9f0a;--ln:#2c2c2e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.3 system-ui,-apple-system,Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
h1{margin:0;font-size:28px}
.hb{background:var(--card);color:var(--or);border:0;border-radius:18px;padding:8px 14px;font-size:14px}
main{flex:1;overflow-y:auto;padding:8px 14px 90px}
nav{display:flex;background:#111;border-top:1px solid var(--ln)}
nav button{flex:1;min-width:0;background:none;border:0;color:var(--mu);padding:8px 0 10px;font-size:10px;letter-spacing:-.2px;white-space:nowrap}nav button .ni{display:block;font-size:20px;line-height:1.25}
nav button.on{color:var(--or)}
.card{background:var(--card);border-radius:20px;padding:6px 14px;margin-bottom:14px}
.r{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.r:last-child{border:0}
.cb{width:26px;height:26px;border:2px solid #777;border-radius:8px;flex:none}
.cb.on{background:var(--or);border-color:var(--or);position:relative}
.cb.on::after{content:"✓";position:absolute;inset:0;text-align:center;color:#000;font-weight:700;line-height:22px}
.rm{flex:1;min-width:0}
.tt{font-size:17px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--mu);margin-top:2px}
.pl{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;color:var(--c);border:1px solid var(--c)}
.dt{color:var(--or);font-size:15px;white-space:nowrap;align-self:flex-start;padding-top:4px;text-align:right}
.dt.od{color:#ff453a}
.dn .tt{text-decoration:line-through;color:var(--mu)}
.ban{border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;background:#2a2410;border:1px solid #6b5a14}
.ban.hot{background:#2d1412;border-color:#8a2b22}.ban.ok{background:#10261a;border-color:#1f6b3d}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--or);color:#000;border:0;font-size:34px;line-height:1;box-shadow:0 4px 14px #000a}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}
.day{background:var(--card);border-radius:10px;min-height:54px;padding:4px;text-align:center;font-size:14px}
.day.today{outline:1.5px solid var(--or)}.day.sel{background:#3a2a0a}.day.x{opacity:.25}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.mh{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.mh button{background:var(--card);color:var(--tx);border:0;border-radius:12px;width:42px;height:38px;font-size:18px}
h3{margin:18px 4px 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;display:inline-block}
.x2{margin-left:auto;background:none;border:0;color:var(--mu);font-size:13px}
input,select,textarea{background:#2c2c2e;color:var(--tx);border:0;border-radius:10px;padding:11px;font-size:16px;width:100%;font-family:inherit}
textarea{display:block;min-height:110px;max-height:40vh;resize:none;line-height:1.35}
input[type=checkbox]{width:22px;height:22px;padding:0;flex:none;accent-color:#ff9f0a}
.ck{display:flex;align-items:center;gap:10px;margin:2px 0 0;font-size:14px;color:var(--tx)}
input[type=color]{width:46px;padding:2px;height:42px;flex:none}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:6px 12px;border-radius:16px;border:1.5px solid var(--c,#666);color:var(--c,#bbb);font-size:14px}
.chip.on{background:var(--c,#555);color:#000;font-weight:600}
.cu{display:none;gap:8px;margin-top:8px}.cu.show{display:flex}.cu.col{flex-direction:column;gap:10px}
#m{position:fixed;inset:0;background:#000d;display:none;align-items:flex-end;justify-content:center;z-index:9}
#m.show{display:flex}
.sheet{background:#161618;width:100%;max-width:560px;max-height:94%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.btns{display:flex;gap:10px;margin-top:20px}
.btns button{flex:1;padding:13px;border:0;border-radius:12px;font-size:16px;background:#2c2c2e;color:var(--tx)}
.btns .pr{background:var(--or);color:#000;font-weight:600}.btns .dl{color:#ff453a}
.row2{display:flex;gap:8px;align-items:center}
.cx{margin-left:7px;opacity:.8;padding:0 2px}.pt{font-size:12px;color:#c7c7cc;text-align:right;margin-top:3px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.wk input{padding:9px 2px;text-align:center;font-size:15px}.wk .wd{text-align:center;color:var(--mu);font-size:12px;padding:2px 0}
.nw{margin-bottom:24px;border:1px dashed #48484a;background:#141416}.ar{color:var(--mu);width:14px;display:inline-block}
.cs{width:42px;height:42px;border-radius:50%;border:2px solid #666;flex:none;padding:0}
.dot.dm{border-radius:1px;transform:rotate(45deg);width:8px;height:8px;margin:0 1px}
#cp{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}#cp.show{display:flex}
#cps{background:#222428;border-radius:16px;width:100%;max-width:420px;padding:16px}
.cprow{display:flex;margin-top:12px;border-radius:10px;overflow:hidden;height:170px}
#cp_sw{width:30%}
#cp_sv{flex:1;position:relative;touch-action:none;background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,var(--h,#f00))}
#cp_cur{position:absolute;width:22px;height:22px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 3px #0008}
#cp_hue{position:relative;height:14px;border-radius:7px;margin:24px 10px 6px;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#cp_th{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 3px #0008}
.dt .pt.ind{white-space:normal;max-width:120px;margin-left:auto;overflow-wrap:anywhere}
.dtl{display:block;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--ln);font-size:15px}.kv:last-child{border:0}
.kv .k{color:var(--mu);flex:none}.kv .v{text-align:right;overflow-wrap:anywhere}

.hr{display:flex;gap:8px;align-items:center}.hb.ic{padding:8px 11px;font-size:15px}
.cnt{color:var(--mu)}.cnt.ok{color:#30d158}.di{font-size:12px;margin-left:6px}
mark{background:#ff9f0a55;color:inherit;border-radius:3px;padding:0 1px}
.snp{font-size:13px;color:var(--mu);margin-top:3px;overflow-wrap:anywhere}
.itr{display:flex;gap:8px;align-items:center;margin-bottom:8px}.itr input{flex:1}
.itx{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:#2c2c2e;color:var(--mu);font-size:20px}
.addit{background:none;border:0;color:var(--or);font-size:15px;padding:6px 2px}
#sr{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sr.show{display:block}
#sr .in{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column}
.sbar{display:flex;gap:8px;padding:12px 14px 8px;align-items:center}.sbar input{flex:1;border-radius:14px}
.sfr{display:flex;align-items:center;gap:10px;padding:2px 14px 8px}
.fbt{background:var(--card);color:var(--tx);border:0;border-radius:16px;padding:8px 14px;font-size:14px}
.bdg{background:var(--or);color:#000;border-radius:9px;padding:0 6px;font-size:12px;margin-left:4px}
#sr_f{display:none;max-height:44vh;overflow-y:auto;padding:0 14px 12px;border-bottom:1px solid var(--ln)}
#sr_res{flex:1;overflow-y:auto;padding:10px 14px 30px}
.fd{position:relative;width:min(76vw,290px);aspect-ratio:1;margin:28px auto 26px}
.fd svg{position:absolute;inset:0;width:100%;height:100%}
.fd .tr{fill:none;stroke:#2c2c2e;stroke-width:8}
.fd .rg{fill:none;stroke:var(--or);stroke-width:8;stroke-linecap:round;transition:stroke-dasharray .3s linear,stroke-dashoffset .3s linear}
.fd .rg.ok{stroke:#30d158}
.fc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ft{font-size:54px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.fs{font-size:13px;color:var(--mu);margin-top:6px}
.fin{display:flex;align-items:flex-start;gap:4px}.fin>div{text-align:center}
.fin input{width:84px;background:none;border-radius:0;text-align:center;font-size:54px;font-weight:300;padding:0;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.fin input::-webkit-inner-spin-button,.fin input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fin .cl{font-size:50px;font-weight:300;color:var(--mu);line-height:1.15}
.fin small{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.fb{display:flex;justify-content:center;gap:12px}
.fb button{min-width:136px;padding:14px;border:0;border-radius:26px;font-size:16px;background:var(--card);color:var(--tx)}
.fb .pr{background:var(--or);color:#000;font-weight:600}
@media(max-width:340px){nav button{font-size:9px;letter-spacing:-.3px}}

.tb{display:flex;gap:4px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:0;background:#161618;z-index:2}
.tbb{flex:none;min-width:36px;height:38px;border:0;border-radius:10px;background:#2c2c2e;color:var(--tx);font-size:15px;padding:0 7px}
.tbb.on{background:var(--or);color:#000}
.hlr{display:flex;gap:10px;padding:2px 2px 10px}.hlc{width:32px;height:32px;border-radius:50%;border:0;color:var(--tx);font-size:14px}.hlc.no{background:#2c2c2e}
.lkr{display:flex;gap:6px;padding-bottom:8px}.lkr input{flex:1;min-width:0}
.rt{background:#2c2c2e;border-radius:10px;padding:11px;min-height:110px;font-size:16px;line-height:1.4;outline:none;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.rt:empty:before{content:attr(data-ph);color:#636366}
.rt a{color:#64d2ff;text-decoration:underline}
.rt img{display:block;max-width:100%;max-height:240px;object-fit:contain;border-radius:8px;margin:6px 0;background:#1c1c1e}
.rt ul,.rt ol{margin:4px 0;padding-left:24px}
.rt [style*="rgb"]{color:#111;border-radius:3px;padding:0 2px}
#lb{position:fixed;inset:0;background:#000f;z-index:30;display:none;flex-direction:column}
#lb.show{display:flex}
#lb .lbt{display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
#lb img{flex:1;min-height:0;width:100%;object-fit:contain;touch-action:pinch-zoom}
</style>
</head>
<body>
<div id="app">
<header><h1 id="ttl">Martin</h1><div class="hr"><button class="hb ic" id="sb" onclick="srOpen()" aria-label="Пошук">🔍</button><button class="hb" id="hb"></button></div></header>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<button class="fab" id="fab" onclick="openForm()">+</button>
<div id="m"><div class="sheet" id="sheet"></div></div>
<div id="lb"><div class="lbt"><button class="hb" onclick="lbDel()">🗑 Видалити</button><button class="hb" onclick="lbClose()">✕ Закрити</button></div><img id="lb_i" alt=""></div>
<div id="sr"><div class="in"><div class="sbar"><input id="sq" type="search" placeholder="Пошук завдань" autocomplete="off" enterkeyhint="search" oninput="srRes()"><button class="hb" onclick="srClose()">Закрити</button></div><div class="sfr"><button class="fbt" id="sfb" onclick="srFo()"></button><span id="sfx" style="margin-left:auto"></span></div><div id="sr_f"></div><div id="sr_res"></div></div></div>
<div id="cp"><div id="cps"><b style="font-size:18px">Вибір кольору</b><div class="cprow"><div id="cp_sw"></div><div id="cp_sv"><div id="cp_cur"></div></div></div><div id="cp_hue"><div id="cp_th"></div></div><div class="row2" style="margin-top:14px"><input id="cp_hex" maxlength="7" style="font-family:monospace" oninput="cpHex(this.value)"></div><div class="btns"><button onclick="cpClose()">Скасувати</button><button class="pr" onclick="cpOk()">Готово</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cbtn=(id,v,on)=>`<button type="button" class="cs" id="${id}" data-v="${v}" style="background:${v}" onclick="cpOpen('${id}')"${on?` onchange="${on}"`:''}></button>`;
const KEY='martin_v1',KINDS={type:'Тип завдання',diff:'Важкість',ind:'Свій індикатор'};
const MON=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const MONF=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const DEF={tasks:[],cap:2,subjects:[{id:'s1',name:'Фізика',color:'#38bdf8'},{id:'s2',name:'Історія України',color:'#fb923c'},{id:'s3',name:'Основи академ. письма',color:'#a78bfa'}],
presets:{ind:[],type:[{l:'Творчий',c:'#a78bfa'},{l:'Математичний',c:'#38bdf8'},{l:'Рутинний',c:'#94a3b8'}],
diff:[{l:'Легкий',c:'#4ade80'},{l:'Середній',c:'#facc15'},{l:'Важкий',c:'#e5383b'},{l:'Реферат',c:'#f472b6'},{l:'Диплом',c:'#a855f7'}],
time:[{l:'5 хв',c:'#4ade80'},{l:'30 хв',c:'#a3e635'},{l:'Година',c:'#facc15'},{l:'На кілька днів',c:'#fb923c'}]}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||JSON.parse(JSON.stringify(DEF));
if(!S.caps)S.caps=Array(7).fill(S.cap||2);
if(!S.presets.ind)S.presets.ind=[];
if(!S.names)S.names={};
(function(){const R=(l,o,n)=>[...S.presets.diff,...S.tasks.map(t=>t.diff)].forEach(p=>{if(p&&p.l===l&&p.c===o)p.c=n});R('Диплом','#ef4444','#a855f7');R('Важкий','#fb923c','#e5383b')})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const pd=s=>new Date(s+'T00:00');
const fd=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
let view='list',cur=new Date(),selDay=today(),F=null;
cur.setDate(1);

const kn=k=>(S.names&&S.names[k])||KINDS[k];
const cntH=t=>{const n=(t.items||[]).length;if(!n)return '';const c=t.items.filter(x=>x.d).length;return ` · <span class="cnt${c===n?' ok':''}">☑ ${c}/${n}</span>`};
const hl=(x,w)=>{x=String(x);if(!w)return esc(x);const re=new RegExp('('+w.map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')+')','gi');return x.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('')};
function snip(t,w){if(!w)return '';const src=[t.desc||'',...(t.items||[]).map(i=>i.t)];const lw=w.map(a=>a.toLowerCase());
for(const raw of src){const x=raw.replace(/\s+/g,' '),lx=x.toLowerCase();let at=-1;for(const a of lw){const j=lx.indexOf(a);if(j>=0&&(at<0||j<at))at=j}
if(at>=0){const a=Math.max(0,at-30),b=Math.min(x.length,at+70);return `<div class="snp">${a?'…':''}${hl(x.slice(a,b),w)}${b<x.length?'…':''}</div>`}}return ''}
const indR=t=>t.ind?(t.ind.c?`<div class="pt ind"><span class="pill" style="--c:${t.ind.c}">${esc(t.ind.l)}</span></div>`:`<div class="pt ind">${esc(t.ind.l)}</div>`):'';
function row(t,w){w=Array.isArray(w)&&w.length?w:null;const sb=S.subjects.find(s=>s.id===t.subj),od=!t.done&&t.date<today();
return `<div class="r ${t.done?'dn':''}"><div class="cb ${t.done?'on':''}" onclick="tog('${t.id}')"></div><div class="rm" onclick="openDetail('${t.id}')"><div class="tt">${hl(t.title,w)}</div><div class="sub">${sb?`<span style="color:${sb.color}">${esc(sb.name)}</span> · `:''}${t.hours||0} год${cntH(t)}${t.desc||t.descH?'<span class="di">📝</span>':''}</div>${snip(t,w)}<div class="pl">${['type','diff'].map(k=>t[k]?`<span class="pill" style="--c:${t[k].c}">${esc(t[k].l)}</span>`:'').join('')}</div></div><div class="dt ${od?'od':''}">${fd(t.date)}${t.pts!=null&&t.pts!==''?`<div class="pt">${t.pts} б.</div>`:''}${indR(t)}</div></div>`}
const open=()=>S.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date));
const heavy=t=>t.diff&&/важк|реферат|диплом/i.test(t.diff.l);

function capUntil(ds){let s=0,d=pd(today()),e=pd(ds);for(;d<=e;d.setDate(d.getDate()+1))s+=+S.caps[(d.getDay()+6)%7]||0;return s}
function banner(){
const o=open();if(!o.length)return '';
const td=today(),late=o.filter(t=>t.date<td).length;let best=null,cum=0;
o.forEach((t,i)=>{cum+=+t.hours||0;const days=Math.max(1,Math.round((pd(t.date)-pd(td))/864e5)+1);const capH=capUntil(t.date);const ratio=cum/Math.max(capH,.1);
if(t.date>=td&&(!best||ratio>best.ratio))best={t,ratio,cum,days,capH,hv:o.slice(0,i+1).filter(heavy).length}});
let h='';
if(late)h+=`<div class="ban hot">⏰ Прострочених завдань: ${late}. Почни з найстаріших — по одному кроку.</div>`;
if(best&&best.ratio>=.5){const p=Math.round(best.ratio*100),hot=best.ratio>=.8;
h+=`<div class="ban ${hot?'hot':''}">${hot?'🔥':'⚠️'} До «${esc(best.t.title)}» ${best.days} дн., але разом із попередніми завданнями назбиралось ${best.cum} год${best.hv?` (важких: ${best.hv})`:''}. Це ~${p}% твого вільного часу до дедлайну (${best.capH} год). ${hot?'Краще почати вже сьогодні!':'Не відкладай — зроби хоча б перший крок.'}</div>`}
else if(!late)h+=`<div class="ban ok">✅ Навантаження в нормі. Хороший момент, щоб зробити щось наперед!</div>`;
return h}

function render(){
$('#ttl').textContent={list:'Martin',cal:'Календар',subj:'Предмети',foc:'Фокус',set:'Налаштування',arch:'Архів'}[view];
const hb=$('#hb');hb.style.display=view==='list'||view==='arch'?'':'none';hb.textContent=view==='arch'?'← Список':'Архів';hb.onclick=()=>go(view==='arch'?'list':'arch');$('#sb').style.display=view==='set'||view==='foc'?'none':'';
$('#fab').style.display=view==='list'||view==='cal'?'':'none';

function calView(){
const y=cur.getFullYear(),mo=cur.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
let c=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(d=>`<div class="wd">${d}</div>`).join('');
for(let i=0;i<first;i++)c+='<div></div>';
for(let d=1;d<=dim;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ts=S.tasks.filter(t=>t.date===k&&!t.done);
c+=`<div class="day ${k===today()?'today':''} ${k===selDay?'sel':''}" onclick="selDay='${k}';render()">${d}<div class="dots">${ts.slice(0,6).map(t=>`<span class="dot${t.diff&&/диплом/i.test(t.diff.l)?' dm':''}" style="--c:${t.diff?t.diff.c:'#8e8e93'}"></span>`).join('')}</div></div>`}
const sel=S.tasks.filter(t=>t.date===selDay).sort((a,b)=>a.done-b.done);
return `<div class="mh"><button onclick="mv(-1)">‹</button><b>${MONF[mo]} ${y}</b><button onclick="mv(1)">›</button></div><div class="cal">${c}</div><h3>${fd(selDay)}</h3>${sel.length?`<div class="card">${sel.map(row).join('')}</div>`:'<div class="empty" style="padding:14px">На цей день завдань немає</div>'}`}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}

function setView(){return `<h3>Вільні години на навчання</h3><div class="wk">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map((n,i)=>`<div><div class="wd">${n}</div><input type="number" min="0" max="24" step="0.5" value="${S.caps[i]}" onchange="S.caps[${i}]=Math.max(0,+this.value||0);save()"></div>`).join('')}</div><div class="sub" style="margin-top:6px">Скільки годин у цей день тижня ти реально можеш витратити на завдання. Потрібно для підказок про навантаження.</div>${indSet()}<h3>Резервна копія</h3><div class="row2"><button class="hb" onclick="exportData()">⬇ Зберегти копію</button><button class="hb" onclick="$('#imp').click()">⬆ Відновити з копії</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)"></div><div class="sub" style="margin-top:6px">Файл збережеться в «Завантаження». Роби копію раз на кілька днів.</div>`}

async function exportData(){const ids=new Set();S.tasks.forEach(t=>(t.descH||'').replace(/data-i="([^"]+)"/g,(m,i)=>ids.add(i)));const imgs={};for(const i of ids){const v=await IM.get(i);if(v)imgs[i]=v.d}
const b=new Blob([JSON.stringify({...S,_imgs:imgs})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='martin-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.subjects)||!d.presets)throw 0;if(!confirm('Замінити поточні дані копією? ('+d.tasks.length+' завдань)')){inp.value='';return}const im=d._imgs||{};delete d._imgs;Object.entries(im).forEach(([k,v])=>IM.put(k,{d:v,t:Date.now()}));S=d;if(!S.caps)S.caps=Array(7).fill(S.cap||2);if(!S.presets.ind)S.presets.ind=[];if(!S.names)S.names={};save();render()}catch(e){alert('Не вдалося прочитати файл копії')}inp.value=''};r.readAsText(f)}

if(k==='ind'&&p&&!p.c)$('#ep_c').style.display='none';
$('#sheet').scrollTop=0;$('#m').classList.add('show')}
function savePreset(){const k=F.pk,n=$('#ep_n').value.trim();if(!n){alert('Вкажи назву');return}
const col=k==='ind'&&!$('#ep_ck').checked?null:$('#ep_c').dataset.v;
if(S.presets[k].some((p,j)=>j!==F.pi&&p.l.toLowerCase()===n.toLowerCase())){alert('Таке значення вже є');return}
const nv={l:n,c:col};
if(F.pi>=0){const old=S.presets[k][F.pi];S.tasks.forEach(t=>{if(same(t[k],old))t[k]={...nv}});S.presets[k][F.pi]=nv}else S.presets[k].push(nv);
save();closeF();window._keep=1;render();window._keep=0}
function delPresetS(){const k=F.pk,p=S.presets[k][F.pi];if(!confirm('Видалити «'+p.l+'»? У вже створених завданнях він залишиться.'))return;S.presets[k].splice(F.pi,1);save();closeF();window._keep=1;render();window._keep=0}
function resetTypes(){DEF.presets.type.forEach(d=>{if(!S.presets.type.some(p=>p.l===d.l))S.presets.type.push({...d})});save();window._keep=1;render();window._keep=0}

/* search + filters */
const SR={open:false,fo:false,st:'all',subj:[],type:[],diff:[],ind:[]};
function srOpen(){SR.open=true;$('#sr').classList.add('show');srUp();setTimeout(()=>$('#sq').focus(),60)}
function srClose(){SR.open=false;$('#sr').classList.remove('show')}
function srFo(){SR.fo=!SR.fo;srUp()}
function srCnt(){return (SR.st!=='all'?1:0)+SR.subj.length+SR.type.length+SR.diff.length+SR.ind.length}
function srReset(){SR.st='all';SR.subj=[];SR.type=[];SR.diff=[];SR.ind=[];srUp()}
function srT(g,v){const a=SR[g],i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);srUp()}
function srSt(v){SR.st=v;srUp()}
function srVals(k){const o=[];[...S.presets[k],...S.tasks.map(t=>t[k])].forEach(p=>{if(p&&!o.some(x=>x.l===p.l))o.push(p)});return o}
const chp=(g,v,t,c)=>`<span class="chip ${SR[g].includes(v)?'on':''}" style="--c:${c||'#e5e5ea'}" data-v="${esc(v)}" onclick="srT('${g}',this.dataset.v)">${esc(t)}</span>`;
function srUp(){const n=srCnt();
$('#sfb').innerHTML='Фільтри '+(SR.fo?'▴':'▾')+(n?` <b class="bdg">${n}</b>`:'');
$('#sfx').innerHTML=n?'<button class="x2" onclick="srReset()">Скинути</button>':'';
const f=$('#sr_f');f.style.display=SR.fo?'block':'none';
if(SR.fo){let h=`<label style="margin-top:4px">Статус</label><div class="chips">${[['all','Усі'],['act','Активні'],['done','Виконані'],['late','Прострочені']].map(([v,t])=>`<span class="chip ${SR.st===v?'on':''}" style="--c:#e5e5ea" onclick="srSt('${v}')">${t}</span>`).join('')}</div>`;
h+=`<label>Предмет</label><div class="chips">${[...S.subjects.map(s=>[s.id,s.name,s.color]),['_no','Без предмета','#8e8e93']].map(([v,t,c])=>chp('subj',v,t,c)).join('')}</div>`;
['type','diff','ind'].forEach(k=>{const vs=srVals(k);if(vs.length)h+=`<label>${kn(k)}</label><div class="chips">${vs.map(p=>chp(k,p.l,p.l,p.c)).join('')}</div>`});
f.innerHTML=h}
srRes()}
function srMatch(t,w){
if(SR.st==='act'&&t.done)return false;if(SR.st==='done'&&!t.done)return false;if(SR.st==='late'&&(t.done||t.date>=today()))return false;
if(SR.subj.length&&!SR.subj.includes(S.subjects.some(s=>s.id===t.subj)?t.subj:'_no'))return false;
for(const k of ['type','diff','ind'])if(SR[k].length&&!(t[k]&&SR[k].includes(t[k].l)))return false;
if(!w.length)return true;
const sb=S.subjects.find(s=>s.id===t.subj);
const hay=[t.title,t.desc,sb&&sb.name,...['type','diff','ind'].map(k=>t[k]&&t[k].l),...(t.items||[]).map(i=>i.t)].filter(Boolean).join(' ').toLowerCase();
return w.every(x=>hay.includes(x.toLowerCase()))}
function srRes(){const q=$('#sq').value.trim(),w=q?q.split(/\s+/):[];
const r=S.tasks.filter(t=>srMatch(t,w)).sort((a,b)=>(a.done-b.done)||(a.done?(b.doneAt||0)-(a.doneAt||0):a.date.localeCompare(b.date)));
$('#sr_res').innerHTML=(w.length||srCnt())?(r.length?`<div class="sub" style="margin:2px 4px 8px">Знайдено: ${r.length}</div><div class="card">${r.map(t=>row(t,w)).join('')}</div>`:'<div class="empty">Нічого не знайдено</div>'):'<div class="empty">Введи слово або обери фільтри</div>'}

/* focus session */
const FK='martin_focus';
let FC;try{FC=JSON.parse(localStorage.getItem(FK))}catch(e){}
FC=FC||{h:0,m:25,st:'idle'};
const fsave=()=>{try{localStorage.setItem(FK,JSON.stringify(FC))}catch(e){}};
const RC=2*Math.PI*100,p2=n=>String(n).padStart(2,'0');
let fTimer=null,wl=null,actx=null;
const hhmm=ts=>{const d=new Date(ts);return p2(d.getHours())+':'+p2(d.getMinutes())};
const fFmt=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+p2(m):p2(m))+':'+p2(s%60)};
const fDur=ms=>{const m=Math.round(ms/60000),h=Math.floor(m/60);return ((h?h+' год ':'')+(m%60?m%60+' хв':'')).trim()||'0 хв'};
const fLeft=()=>FC.st==='run'?Math.max(0,FC.end-Date.now()):FC.st==='pause'?FC.left:0;
function focView(){
const st=FC.st,L=fLeft(),frac=st==='run'||st==='pause'?L/FC.dur:1,rem=RC*Math.max(0,Math.min(1,frac));
const ring=`<svg viewBox="0 0 220 220"><circle class="tr" cx="110" cy="110" r="100"/><circle class="rg ${st==='done'?'ok':''}" id="f_rg" cx="110" cy="110" r="100" transform="rotate(-90 110 110)" style="stroke-dasharray:${rem} ${RC};stroke-dashoffset:${-(RC-rem)};opacity:${rem<=.5?0:1}"/></svg>`;
let mid,btn;
if(st==='idle'){
mid=`<div class="fin"><div><input id="f_h" type="number" inputmode="numeric" min="0" max="24" value="${FC.h}" onfocus="this.select()"><small>год</small></div><span class="cl">:</span><div><input id="f_m" type="number" inputmode="numeric" min="0" max="59" value="${FC.m}" onfocus="this.select()"><small>хв</small></div></div>`;
btn=`<button class="pr" onclick="fStart()">Почати</button>`}
else if(st==='done'){
mid=`<div class="ft" style="font-size:42px;letter-spacing:0">Готово</div><div class="fs">Фокус ${fDur(FC.dur)}</div>`;
btn=`<button class="pr" onclick="fReset()">Нова сесія</button>`}
else{
mid=`<div class="ft" id="f_t" style="${st==='pause'?'opacity:.55':''}">${fFmt(L)}</div><div class="fs" id="f_s">${st==='pause'?'Пауза':'до '+hhmm(FC.end)}</div>`;
btn=`<button class="pr" onclick="fPause()">${st==='pause'?'Продовжити':'Пауза'}</button><button onclick="fReset()">Скинути</button>`}
return `<div class="fd">${ring}<div class="fc">${mid}</div></div><div class="fb">${btn}</div>`}
function fStart(){
const h=Math.max(0,Math.floor(+$('#f_h').value||0)),m=Math.max(0,Math.floor(+$('#f_m').value||0)),tot=(h*60+m)*60000;
if(!tot){alert('Вкажи час: години або хвилини');return}
if(tot>864e5){alert('Не більше 24 годин');return}
FC.h=h;FC.m=m;FC.dur=tot;FC.end=Date.now()+tot;FC.st='run';fsave();
try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.resume)actx.resume()}catch(e){}
fWake();fTick0();render()}
function fPause(){
if(FC.st==='run'){FC.left=Math.max(0,FC.end-Date.now());FC.st='pause';clearInterval(fTimer);fWakeOff()}
else if(FC.st==='pause'){FC.end=Date.now()+FC.left;FC.st='run';fWake();fTick0()}
fsave();render()}
function fReset(){if((FC.st==='run'||FC.st==='pause')&&!confirm('Скинути таймер?'))return;
clearInterval(fTimer);fWakeOff();FC.st='idle';fsave();render()}
function fTick0(){clearInterval(fTimer);fTimer=setInterval(fTick,250)}
function fTick(){
if(FC.st!=='run'){clearInterval(fTimer);return}
const L=Math.max(0,FC.end-Date.now());
if(L<=0){FC.st='done';fsave();clearInterval(fTimer);fWakeOff();fBeep();window._keep=1;render();window._keep=0;return}
if(view==='foc'){const t=$('#f_t'),g=$('#f_rg');if(t&&g){t.textContent=fFmt(L);const rem=RC*L/FC.dur;g.style.strokeDasharray=rem+' '+RC;g.style.strokeDashoffset=-(RC-rem);g.style.opacity=rem<=.5?0:1}}}
function fBeep(){
try{navigator.vibrate&&navigator.vibrate([300,120,300,120,300])}catch(e){}
try{if(!actx)return;[0,.35,.7].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+d;o.type='sine';o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.start(t);o.stop(t+.32)})}catch(e){}}
async function fWake(){try{if('wakeLock' in navigator&&FC.st==='run'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}}
function fWakeOff(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&FC.st==='run'){fTick();fWake()}});

/* form */
const same=(a,b)=>a&&b&&a.l===b.l&&a.c===b.c;

const PAL=['#ffd60a','#ff9f0a','#30d158','#64d2ff','#ff6482'];

const TAGS={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,BR:1,DIV:1,P:1,UL:1,OL:1,LI:1,A:1,IMG:1,SPAN:1};
const DROP={SCRIPT:1,STYLE:1,IFRAME:1,OBJECT:1,EMBED:1,NOSCRIPT:1,TEMPLATE:1,HEAD:1,TITLE:1,META:1,LINK:1,SVG:1,CANVAS:1,TEXTAREA:1,SELECT:1,BUTTON:1,INPUT:1};
function clean(html){
const src=new DOMParser().parseFromString('<body>'+String(html||'')+'</body>','text/html').body,out=document.createElement('div');
(function walk(s,d){s.childNodes.forEach(n=>{
if(n.nodeType===3){d.appendChild(document.createTextNode(n.nodeValue));return}
if(n.nodeType!==1)return;const g=n.tagName;
if(DROP[g])return;
if(!TAGS[g]){walk(n,d);return}
if(g==='IMG'){const i=n.getAttribute('data-i');if(i&&/^[\w-]+$/.test(i)){const e=document.createElement('img');e.setAttribute('data-i',i);d.appendChild(e)}return}
const bg=hexOf(n.style.backgroundColor),hasBg=PAL.includes(bg);
if(g==='SPAN'){if(hasBg){const e=document.createElement('span');e.style.backgroundColor=bg;walk(n,e);d.appendChild(e)}else walk(n,d);return}
if(g==='A'){const h=n.getAttribute('href')||'';if(/^(https?:|mailto:|tel:)/i.test(h)){const e=document.createElement('a');e.setAttribute('href',h);if(hasBg)e.style.backgroundColor=bg;walk(n,e);d.appendChild(e)}else walk(n,d);return}
const e=document.createElement(g==='STRONG'?'B':g==='EM'?'I':g==='STRIKE'||g==='DEL'?'S':g);if(hasBg&&g!=='BR')e.style.backgroundColor=bg;walk(n,e);d.appendChild(e)})})(src,out);
return !out.textContent.trim()&&!out.querySelector('img')?'':out.innerHTML}
function linkify(el){const re=/((?:https?:\/\/|www\.)[^\s<>"']*[^\s<>"'.,;:!?)\]»])/gi;
const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),L=[];let n;
while(n=w.nextNode())if(!n.parentElement.closest('a')&&/(https?:\/\/|www\.)/i.test(n.nodeValue))L.push(n);
L.forEach(n=>{const t=n.nodeValue,f=document.createDocumentFragment();let i=0,m;re.lastIndex=0;
while(m=re.exec(t)){if(m.index>i)f.appendChild(document.createTextNode(t.slice(i,m.index)));const a=document.createElement('a');a.setAttribute('href',/^www\./i.test(m[1])?'https://'+m[1]:m[1]);a.textContent=m[1];f.appendChild(a);i=m.index+m[1].length}
if(i<t.length)f.appendChild(document.createTextNode(t.slice(i)));n.replaceWith(f)})}

function drag(el,fn){const mv=e=>{const r=el.getBoundingClientRect();fn(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)))};el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);mv(e);el.onpointermove=mv});el.addEventListener('pointerup',()=>{el.onpointermove=null})}
drag($('#cp_sv'),(x,y)=>{CP.s=x;CP.v=1-y;cpUp()});drag($('#cp_hue'),x=>{CP.h=Math.min(359.99,x*360);cpUp()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(FC.st==='run'){if(FC.end<=Date.now()){FC.st='done';fsave()}else{fTick0();fWake()}}
render();
setTimeout(gcImgs,3000);
</script>
