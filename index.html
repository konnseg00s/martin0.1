<body>
<div id="app">
<header><h1 id="ttl" onclick="egTap()">Martin</h1><div class="hr"><button class="hb ic" id="fcb" onclick="foOpen()" aria-label="Фокус">⏱</button><button class="hb ic" id="sb" onclick="srOpen()" aria-label="Пошук">🔍</button><button class="hb" id="hb"></button></div></header>

</div>

<div id="sr"><div class="in"><div class="sbar"><input id="sq" type="search" placeholder="Пошук завдань" autocomplete="off" enterkeyhint="search" oninput="srRes()"><button class="hb" onclick="srClose()">Закрити</button></div><div class="sfr"><button class="fbt" id="sfb" onclick="srFo()"></button><span id="sfx" style="margin-left:auto"></span></div><div id="sr_f"></div><div id="sr_res"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cbtn=(id,v,on)=>`<button type="button" class="cs" id="${id}" data-v="${v}" style="background:${v}" onclick="cpOpen('${id}')"${on?` onchange="${on}"`:''}></button>`;
const KEY='martin_v1',KINDS={type:'Тип завдання',diff:'Важкість',ind:'Свій індикатор'};
const MON=['січ','лют','бер','кві','тра','чер','лип','сер','вер','жов','лис','гру'];
const MONF=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
const DEF={tasks:[],cap:2,subjects:[{id:'s1',name:'Фізика',color:'#38bdf8'},{id:'s2',name:'Історія України',color:'#fb923c'},{id:'s3',name:'Основи академ. письма',color:'#a78bfa'}],
presets:{ind:[],type:[{l:'Творчий',c:'#a78bfa'},{l:'Математичний',c:'#38bdf8'},{l:'Рутинний',c:'#94a3b8'}],
diff:[{l:'Легкий',c:'#4ade80'},{l:'Середній',c:'#facc15'},{l:'Важкий',c:'#e5383b'},{l:'Реферат',c:'#f472b6'},{l:'Диплом',c:'#a855f7'}],
time:[{l:'5 хв',c:'#4ade80'},{l:'30 хв',c:'#a3e635'},{l:'Година',c:'#facc15'},{l:'На кілька днів',c:'#fb923c'}]}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||JSON.parse(JSON.stringify(DEF));
if(!S.caps)S.caps=Array(7).fill(S.cap||2);
if(!S.presets.ind)S.presets.ind=[];
if(!S.names)S.names={};
(function(){const R=(l,o,n)=>[...S.presets.diff,...S.tasks.map(t=>t.diff)].forEach(p=>{if(p&&p.l===l&&p.c===o)p.c=n});R('Диплом','#ef4444','#a855f7');R('Важкий','#fb923c','#e5383b')})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const pd=s=>new Date(s+'T00:00');
const fd=s=>{const d=pd(s);return d.getDate()+' '+MON[d.getMonth()]};
let view='list',cur=new Date(),selDay=today(),F=null;
cur.setDate(1);

const kn=k=>(S.names&&S.names[k])||KINDS[k];
const cntH=t=>{const n=(t.items||[]).length;if(!n)return '';const c=t.items.filter(x=>x.d).length;return ` · <span class="cnt${c===n?' ok':''}">☑ ${c}/${n}</span>`};
const hl=(x,w)=>{x=String(x);if(!w)return esc(x);const re=new RegExp('('+w.map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')+')','gi');return x.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('')};
function snip(t,w){if(!w)return '';const src=[t.desc||'',...(t.items||[]).map(i=>i.t)];const lw=w.map(a=>a.toLowerCase());
for(const raw of src){const x=raw.replace(/\s+/g,' '),lx=x.toLowerCase();let at=-1;for(const a of lw){const j=lx.indexOf(a);if(j>=0&&(at<0||j<at))at=j}
if(at>=0){const a=Math.max(0,at-30),b=Math.min(x.length,at+70);return `<div class="snp">${a?'…':''}${hl(x.slice(a,b),w)}${b<x.length?'…':''}</div>`}}return ''}
const indR=t=>t.ind?(t.ind.c?`<div class="pt ind"><span class="pill" style="--c:${t.ind.c}">${esc(t.ind.l)}</span></div>`:`<div class="pt ind">${esc(t.ind.l)}</div>`):'';
function row(t,w){w=Array.isArray(w)&&w.length?w:null;const sb=S.subjects.find(s=>s.id===t.subj),od=!t.done&&t.date<today();
return `<div class="r ${t.done?'dn':''}"><div class="cb ${t.done?'on':''}" onclick="tog('${t.id}',this)"></div><div class="rm" onclick="openDetail('${t.id}')"><div class="tt">${hl(t.title,w)}</div><div class="sub">${sb?`<span style="color:${sb.color}">${esc(sb.name)}</span> · `:''}${t.hours||0} год${cntH(t)}${t.desc||t.descH?'<span class="di">📝</span>':''}</div>${t.done?`<div class="sub" style="font-size:12px">${metaH(t)}</div>`:''}${snip(t,w)}<div class="pl">${['type','diff'].map(k=>t[k]?`<span class="pill" style="--c:${t[k].c}">${esc(t[k].l)}</span>`:'').join('')}</div></div><div class="dt ${od?'od':''}">${fd(t.date)}${t.pts!=null&&t.pts!==''?`<div class="pt">${t.pts} б.</div>`:''}${indR(t)}</div></div>`}
const open=()=>S.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date));
const heavy=t=>t.diff&&/важк|реферат|диплом/i.test(t.diff.l);

function capUntil(ds){let s=0,d=pd(today()),e=pd(ds);for(;d<=e;d.setDate(d.getDate()+1))s+=+S.caps[(d.getDay()+6)%7]||0;return s}
function banner(){
const o=open();if(!o.length)return '';
const td=today(),late=o.filter(t=>t.date<td).length;let best=null,cum=0;
o.forEach((t,i)=>{cum+=+t.hours||0;const days=Math.max(1,Math.round((pd(t.date)-pd(td))/864e5)+1);const capH=capUntil(t.date);const ratio=cum/Math.max(capH,.1);
if(t.date>=td&&(!best||ratio>best.ratio))best={t,ratio,cum,days,capH,hv:o.slice(0,i+1).filter(heavy).length}});
let h='';
if(late)h+=`<div class="ban hot">⏰ Прострочених завдань: ${late}. Почни з найстаріших — по одному кроку.</div>`;
if(best&&best.ratio>=.5){const p=Math.round(best.ratio*100),hot=best.ratio>=.8;
h+=`<div class="ban ${hot?'hot':''}">${hot?'🔥':'⚠️'} До «${esc(best.t.title)}» ${best.days} дн., але разом із попередніми завданнями назбиралось ${best.cum} год${best.hv?` (важких: ${best.hv})`:''}. Це ~${p}% твого вільного часу до дедлайну (${best.capH} год). ${hot?'Краще почати вже сьогодні!':'Не відкладай — зроби хоча б перший крок.'}</div>`}
else if(!late)h+=`<div class="ban ok">✅ Навантаження в нормі. Хороший момент, щоб зробити щось наперед!</div>`;
return h}

function render(){
$('#ttl').textContent={list:'Martin',cal:'Календар',subj:'Предмети',foc:'Фокус',set:'Налаштування',arch:'Архів'}[view];
const hb=$('#hb');hb.style.display=view==='list'||view==='arch'?'':'none';hb.textContent=view==='arch'?'← Список':'Архів';hb.onclick=()=>go(view==='arch'?'list':'arch');$('#sb').style.display=$('#fcb').style.display=view==='set'?'none':'';
$('#fab').style.display=view==='list'||view==='cal'?'':'none';
$('#nav').innerHTML=[['list','📋','Список'],['cal','📅','Календар'],['subj','📚','Предмети'],['set','⚙️','Налаштування']].map(([v,i,n])=>`<button class="${view===v||(v==='list'&&view==='arch')?'on':''}" onclick="go('${v}')"><span class="ni">${i}</span>${n}</button>`).join('');
const m=$('#main');let h='';
if(view==='list'){const o=open();h=banner()+(o.length?`<div class="card">${o.map(row).join('')}</div>`:'<div class="empty">Завдань немає 🎉<br>Натисни «+», щоб додати</div>')}
else if(view==='arch'){const d=S.tasks.filter(t=>t.done).sort((a,b)=>(a.doneAt||0)-(b.doneAt||0));h=d.length?`<div class="card">${d.map(row).join('')}</div>`:'<div class="empty">Архів порожній</div>'}
else if(view==='cal')h=calView();
else if(view==='subj')h=subjView();

else h=setView();
m.innerHTML=h;
if(view==='arch')m.scrollTop=m.scrollHeight;else if(!window._keep)m.scrollTop=0;
if(SR.open)srRes();if(FO.open)$('#fo_c').innerHTML=focView()}

function calView(){
const y=cur.getFullYear(),mo=cur.getMonth(),first=(new Date(y,mo,1).getDay()+6)%7,dim=new Date(y,mo+1,0).getDate();
let c=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(d=>`<div class="wd">${d}</div>`).join('');
for(let i=0;i<first;i++)c+='<div></div>';
for(let d=1;d<=dim;d++){const k=y+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ts=S.tasks.filter(t=>t.date===k&&!t.done);
c+=`<div class="day ${k===today()?'today':''} ${k===selDay?'sel':''}" onclick="selDay='${k}';render()">${d}<div class="dots">${ts.slice(0,6).map(t=>`<span class="dot${t.diff&&/диплом/i.test(t.diff.l)?' dm':''}" style="--c:${t.diff?t.diff.c:'#8e8e93'}"></span>`).join('')}</div></div>`}
const ms=y+'-'+String(mo+1).padStart(2,'0'),bf=S.tasks.filter(t=>!t.done&&t.date.slice(0,7)<ms).length,af=S.tasks.filter(t=>!t.done&&t.date.slice(0,7)>ms).length,bg=n=>n?`<i class="bg">${n}</i>`:'';
const sel=S.tasks.filter(t=>t.date===selDay).sort((a,b)=>a.done-b.done);
return `<div class="mh"><button onclick="mv(-1)">${bg(bf)}‹</button><b>${MONF[mo]} ${y}</b><button onclick="mv(1)">${bg(af)}›</button></div><div class="cal">${c}</div><h3>${fd(selDay)}</h3>${sel.length?`<div class="card">${sel.map(row).join('')}</div>`:'<div class="empty" style="padding:14px">На цей день завдань немає</div>'}`}
function mv(n){cur.setMonth(cur.getMonth()+n);render()}

function subjView(){
let h=`<div class="card nw"><div style="font-weight:600;margin:12px 0 8px">Новий предмет</div><div class="row2" style="padding-bottom:14px"><input id="ns" placeholder="Назва предмета">${cbtn('nc','#34d399')}<button class="hb" onclick="addSubj()">Додати</button></div></div>`;
S.subjects.forEach(s=>{const ts=open().filter(t=>t.subj===s.id),c=S.coll&&S.coll[s.id];
h+=`<h3 onclick="togColl('${s.id}')" style="cursor:pointer"><span class="ar">${c?'▸':'▾'}</span><span class="sw" style="background:${s.color}"></span>${esc(s.name)} <span style="color:var(--mu);font-weight:400">${ts.length}</span><button class="x2" onclick="event.stopPropagation();editSubj('${s.id}')">змінити</button></h3>${!c&&ts.length?`<div class="card">${ts.map(row).join('')}</div>`:''}`});
const no=open().filter(t=>!S.subjects.some(s=>s.id===t.subj));
if(no.length){const c=S.coll&&S.coll._no;h+=`<h3 onclick="togColl('_no')" style="cursor:pointer"><span class="ar">${c?'▸':'▾'}</span>Без предмета <span style="color:var(--mu);font-weight:400">${no.length}</span></h3>${c?'':`<div class="card">${no.map(row).join('')}</div>`}`}
return h}
function setView(){return `<h3>Вільні години на навчання</h3><div class="wk">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map((n,i)=>`<div><div class="wd">${n}</div><input type="number" min="0" max="24" step="0.5" value="${S.caps[i]}" onchange="S.caps[${i}]=Math.max(0,+this.value||0);save()"></div>`).join('')}</div><div class="sub" style="margin-top:6px">Скільки годин у цей день тижня ти реально можеш витратити на завдання. Потрібно для підказок про навантаження.</div>${indSet()}${snowSet()}<h3>Резервна копія</h3><div class="row2"><button class="hb" onclick="exportData()">⬇ Зберегти копію</button><button class="hb" onclick="$('#imp').click()">⬆ Відновити з копії</button><input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)"></div><div class="sub" style="margin-top:6px">Файл збережеться в «Завантаження». Роби копію раз на кілька днів.</div>`}
function togColl(id){S.coll=S.coll||{};S.coll[id]=!S.coll[id];save();window._keep=1;render();window._keep=0}
function editSubj(id){const s=S.subjects.find(x=>x.id===id);F={sid:id};
$('#sheet').innerHTML=`<b style="font-size:20px">Змінити предмет</b><label>Назва</label><div class="row2"><input id="es_n" value="${esc(s.name)}">${cbtn('es_c',s.color)}</div><div class="btns"><button class="dl" onclick="delSubj('${id}')">Видалити</button><button onclick="closeF()">Скасувати</button><button class="pr" onclick="saveSubj()">Зберегти</button></div>`;showM()}
function saveSubj(){const n=$('#es_n').value.trim();if(!n){alert('Вкажи назву');return}const s=S.subjects.find(x=>x.id===F.sid);s.name=n;s.color=$('#es_c').dataset.v;save();closeF();render()}

function addSubj(){const n=$('#ns').value.trim();if(!n)return;S.subjects.push({id:'s'+Date.now(),name:n,color:$('#nc').dataset.v});save();window._keep=0;render()}
function delSubj(id){ask('Видалити предмет? Завдання залишаться без предмета.','Видалити',()=>{S.subjects=S.subjects.filter(s=>s.id!==id);save();closeF();render()},1)}
async function exportData(){const ids=new Set();S.tasks.forEach(t=>(t.descH||'').replace(/data-i="([^"]+)"/g,(m,i)=>ids.add(i)));const imgs={};for(const i of ids){const v=await IM.get(i);if(v)imgs[i]=v.d}
const b=new Blob([JSON.stringify({...S,_imgs:imgs})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='martin-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks)||!Array.isArray(d.subjects)||!d.presets)throw 0;ask('Замінити поточні дані копією? ('+d.tasks.length+' завдань)','Замінити',()=>{const im=d._imgs||{};delete d._imgs;Object.entries(im).forEach(([k,v])=>IM.put(k,{d:v,t:Date.now()}));S=d;if(!S.caps)S.caps=Array(7).fill(S.cap||2);if(!S.presets.ind)S.presets.ind=[];if(!S.names)S.names={};save();render()},1)}catch(e){alert('Не вдалося прочитати файл копії')}inp.value=''};r.readAsText(f)}
function go(v){const a=TABS.indexOf(view==='arch'?'list':view),b=TABS.indexOf(v==='arch'?'list':v);view=v;window._keep=0;render();if(a>=0&&b>=0&&a!==b){const m=$('#main');m.animate&&m.animate([{transform:`translateX(${b>a?50:-50}px)`,opacity:0},{transform:'none',opacity:1}],{duration:260,easing:'cubic-bezier(.2,.8,.3,1)'})}}


/* subtasks */
function itDraw(){$('#f_it').innerHTML=F.items.map((x,i)=>`<div class="itr"><input value="${esc(x.t)}" placeholder="Пункт ${i+1}" oninput="F.items[${i}].t=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();itAdd()}"><button type="button" class="itx" onclick="itDel(${i})">×</button></div>`).join('')}
function itAdd(){F.dirty=1;F.items.push({t:'',d:false});itDraw();const l=document.querySelectorAll('#f_it input');l[l.length-1].focus()}
function itDel(i){F.dirty=1;F.items.splice(i,1);itDraw()}
function itsH(t){const n=(t.items||[]).length;if(!n)return '';const c=t.items.filter(x=>x.d).length;
return `<label>Пункти <span id="d_cnt" class="cnt">${c}/${n}</span></label><div class="card" style="margin-bottom:0">${t.items.map((x,i)=>`<div class="r ${x.d?'dn':''}" onclick="togIt('${t.id}',${i},this)"><div class="cb ${x.d?'on':''}"></div><div class="rm"><div class="tt" style="font-size:16px">${esc(x.t)}</div></div></div>`).join('')}</div>`}
function togIt(id,i,row){const t=S.tasks.find(x=>x.id===id);if(!t)return;const it=t.items[i];it.d=!it.d;save();
row.classList.toggle('dn',it.d);row.querySelector('.cb').classList.toggle('on',it.d);
$('#d_cnt').textContent=t.items.filter(x=>x.d).length+'/'+t.items.length;window._keep=1;render();window._keep=0}

/* indicators in settings */
let indOpen=false;
function togInd(){indOpen=!indOpen;window._keep=1;render();window._keep=0}
function indSet(){
let h=`<h3 onclick="togInd()" style="cursor:pointer"><span class="ar">${indOpen?'▾':'▸'}</span>Індикатори</h3>`;
if(!indOpen)return h;
['type','ind'].forEach(k=>{
const miss=k==='type'&&DEF.presets.type.some(d=>!S.presets.type.some(p=>p.l===d.l));
h+=`<div class="card" style="padding-bottom:10px"><label style="margin-top:12px">Назва індикатора</label><input value="${esc(kn(k))}" onchange="renKind('${k}',this)">
${S.presets[k].map((p,i)=>`<div class="r"><span class="sw" style="background:${p.c||'#e5e5ea'}"></span><div class="rm tt" style="font-size:16px">${esc(p.l)}</div><button class="x2" style="margin:0" onclick="editPreset('${k}',${i})">змінити</button></div>`).join('')}
<div class="row2" style="padding-top:10px"><button class="hb" onclick="editPreset('${k}',-1)">＋ Додати</button>${miss?`<button class="x2" onclick="resetTypes()">Повернути стандартні</button>`:''}</div></div>`});
return h}
function renKind(k,el){const v=el.value.trim();if(v&&v!==KINDS[k])S.names[k]=v;else delete S.names[k];el.value=kn(k);save()}
function editPreset(k,i){const p=i>=0?S.presets[k][i]:null;F={pk:k,pi:i};
$('#sheet').innerHTML=`<b style="font-size:20px">${p?'Змінити значення':'Нове значення'}</b><label>Назва</label><div class="row2"><input id="ep_n" value="${p?esc(p.l):''}" placeholder="Назва значення">${cbtn('ep_c',p&&p.c?p.c:'#ff4d8d')}</div>${k==='ind'?`<label class="ck" style="margin-top:14px"><input type="checkbox" id="ep_ck" ${!p||p.c?'checked':''} onchange="$('#ep_c').style.display=this.checked?'':'none'">З кольором</label>`:''}<div class="btns">${p?'<button class="dl" onclick="delPresetS()">Видалити</button>':''}<button onclick="closeF()">Скасувати</button><button class="pr" onclick="savePreset()">Зберегти</button></div>`;
if(k==='ind'&&p&&!p.c)$('#ep_c').style.display='none';
$('#sheet').scrollTop=0;showM()}
function savePreset(){const k=F.pk,n=$('#ep_n').value.trim();if(!n){alert('Вкажи назву');return}
const col=k==='ind'&&!$('#ep_ck').checked?null:$('#ep_c').dataset.v;
if(S.presets[k].some((p,j)=>j!==F.pi&&p.l.toLowerCase()===n.toLowerCase())){alert('Таке значення вже є');return}
const nv={l:n,c:col};
if(F.pi>=0){const old=S.presets[k][F.pi];S.tasks.forEach(t=>{if(same(t[k],old))t[k]={...nv}});S.presets[k][F.pi]=nv}else S.presets[k].push(nv);
save();closeF();window._keep=1;render();window._keep=0}
function delPresetS(){const k=F.pk,pi=F.pi,p=S.presets[k][pi];ask('Видалити «'+p.l+'»? У вже створених завданнях він залишиться.','Видалити',()=>{S.presets[k].splice(pi,1);save();closeF();rer()},1)}
function resetTypes(){DEF.presets.type.forEach(d=>{if(!S.presets.type.some(p=>p.l===d.l))S.presets.type.push({...d})});save();window._keep=1;render();window._keep=0}

/* search + filters */
const SR={open:false,fo:false,st:'all',subj:[],type:[],diff:[],ind:[]};
function srOpen(){if(SR.open)return;hpush();SR.open=true;$('#sr').classList.add('show');srUp();setTimeout(()=>$('#sq').focus(),60)}
function srClose(){if(SR.open)hpop();SR.open=false;$('#sr').classList.remove('show')}
function srFo(){SR.fo=!SR.fo;srUp()}
function srCnt(){return (SR.st!=='all'?1:0)+SR.subj.length+SR.type.length+SR.diff.length+SR.ind.length}
function srReset(){SR.st='all';SR.subj=[];SR.type=[];SR.diff=[];SR.ind=[];srUp()}
function srT(g,v){const a=SR[g],i=a.indexOf(v);if(i<0)a.push(v);else a.splice(i,1);srUp()}
function srSt(v){SR.st=v;srUp()}
function srVals(k){const o=[];[...S.presets[k],...S.tasks.map(t=>t[k])].forEach(p=>{if(p&&!o.some(x=>x.l===p.l))o.push(p)});return o}
const chp=(g,v,t,c)=>`<span class="chip ${SR[g].includes(v)?'on':''}" style="--c:${c||'#e5e5ea'}" data-v="${esc(v)}" onclick="srT('${g}',this.dataset.v)">${esc(t)}</span>`;
function srUp(){const n=srCnt();
$('#sfb').innerHTML='Фільтри '+(SR.fo?'▴':'▾')+(n?` <b class="bdg">${n}</b>`:'');
